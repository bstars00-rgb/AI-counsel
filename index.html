      function seedHash(s) {
        let h = 5381;
        for (let i = 0; i < s.length; i++) h = (h * 33) ^ s.charCodeAt(i);
        return Math.abs(h);
      }
      function pick(arr, seed) { return arr[seed % arr.length]; }
      function scoreFromSeed(seed, min, max) {
        if (min == null) min = 3;
        if (max == null) max = 5;
        return min + (seed % (max - min + 1));
      }
      function findHotelsForCities(cityEnList, limit) {
        if (limit == null) limit = 3;
        const seen = new Set();
        const out = [];
        for (const c of cityEnList) {
          const list = HOTELS_BY_CITY[c] || [];
          for (const h of list) {
            if (seen.has(h.code)) continue;
            seen.add(h.code);
            out.push(h);
          }
        }
        out.sort((a, b) => a.rank - b.rank);
        return out.slice(0, limit);
      }
      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      }

      function buildMockFortune(input) {
        const today = new Date().toISOString().slice(0, 10);
        const seed = seedHash(input.name + "|" + input.birthdate + "|" + input.birthtime + "|" + today);
        const overall = scoreFromSeed(seed, 3, 5);
        const sTravel = scoreFromSeed(seed >> 1, 3, 5);
        const sMoney = scoreFromSeed(seed >> 2, 3, 5);
        const sLove = scoreFromSeed(seed >> 3, 3, 5);
        const sHealth = scoreFromSeed(seed >> 4, 3, 5);
        const dest = pick(DESTINATIONS, seed >> 5);
        const destScore = scoreFromSeed(seed >> 6, 4, 5);
        const vibe = BIRTHHOUR_VIBE[input.birthtime] || BIRTHHOUR_VIBE["모름"];
        const summaryTpl = pick(SUMMARIES, seed >> 8);
        const reason = input.name + " 님의 " + vibe.phrase + "이라, " + dest.city + "의 " + dest.vibe + " 분위기가 잘 어울려요.";
        return {
          name: input.name,
          headline: pick(HEADLINES, seed >> 7),
          overall_score: overall,
          fortune_summary: summaryTpl.replace("{vibe}", vibe.phrase),
          saju_keywords: vibe.keywords,
          categories: [
            { label: "여행운", score: sTravel, message: pick(CAT_MSGS["여행운"][sTravel], seed >> 9) },

          recommended_destination: {

          recommended_hotels: findHotelsForCities(dest.hotelCities || [], 3),

          if (ok) btn.removeAttribute("disabled");
          else btn.setAttribute("disabled", "");
        }

        const hotelsBlock = hotels.length === 0 ? "" :
          '<div class="rounded-2xl border-2 border-leaf bg-white p-6 shadow-sm sm:p-8">' +
            '<div class="flex items-center gap-2">' +
              '<span class="text-xs font-semibold uppercase tracking-widest text-leaf">OHMYHOTEL &amp; CO 추천</span>' +
              '<span class="inline-flex h-2 w-2 rounded-full bg-leaf"></span>' +
            '</div>' +
            '<h3 class="mt-1.5 text-lg font-bold text-ink sm:text-xl">' + escapeHtml(r.recommended_destination.city) + '에서 묵기 좋은 호텔</h3>' +
            '<p class="mt-1 text-xs text-ink-soft">오마이호텔 Top 100 (' + escapeHtml(COUNTRY_LABEL[hotels[0].country] || "") + ') 기준 상위 추천</p>' +
            '<ul class="mt-4 space-y-2.5">' +
              hotels.map(function (h) {
                return '<li class="flex items-start gap-3 rounded-xl border border-slate-200 bg-cream p-3 sm:p-4">' +
                  '<span class="shrink-0 rounded-md bg-leaf-50 px-2 py-1 text-xs font-bold text-leaf-600">TOP ' + h.rank + '</span>' +
                  '<div class="min-w-0 flex-1">' +
                    '<div class="text-sm font-bold text-ink sm:text-base">' + escapeHtml(h.name) + '</div>' +
                    '<div class="mt-0.5 text-xs text-ink-soft sm:text-sm">' + escapeHtml(h.city) + ' · ' + escapeHtml(h.address) + '</div>' +
                  '</div>' +
                '</li>';
              }).join("") +
            '</ul>' +
          '</div>';

        const luckyTile = function (label, value) {
          return '<div class="rounded-2xl border border-brand-100 bg-white p-3 text-center shadow-sm sm:p-4">' +
            '<div class="text-xs font-semibold text-brand-600">' + escapeHtml(label) + '</div>' +
            '<div class="mt-1 text-sm font-bold text-ink sm:text-base">' + escapeHtml(value) + '</div>' +
            '</div>';
        };

        return '' +
          '<section class="space-y-4">' +
            '<div class="overflow-hidden rounded-2xl border-2 border-brand-200 bg-gradient-to-br from-brand-50 via-white to-brand-100 p-6 shadow-sm sm:p-8">' +
              '<div class="text-xs font-semibold uppercase tracking-widest text-brand-600">OHMYCHI SAJU · ' + escapeHtml(today) + '</div>' +
              '<h2 class="mt-2 text-2xl font-bold text-ink sm:text-3xl">' + escapeHtml(r.name) + ' 님의 오늘 사주 여행운세</h2>' +
              '<p class="mt-2 text-lg font-semibold text-brand-700 sm:text-xl">"' + escapeHtml(r.headline) + '"</p>' +
              '<div class="mt-4 flex items-center gap-2">' + renderStars(r.overall_score, "lg") + '<span class="text-sm font-medium text-ink-soft">(' + r.overall_score + ' / 5)</span></div>' +
              (keywords ? '<div class="mt-3 flex flex-wrap gap-1.5">' + keywords + '</div>' : '') +
              '<p class="mt-4 leading-relaxed text-ink">' + escapeHtml(r.fortune_summary) + '</p>' +
            '</div>' +
            '<div class="grid grid-cols-2 gap-3 sm:grid-cols-4">' + categories + '</div>' +
            '<div class="rounded-2xl border-2 border-brand-200 bg-gradient-to-br from-brand-50 via-white to-brand-50 p-6 shadow-sm sm:p-8">' +
              '<div class="text-xs font-semibold uppercase tracking-widest text-brand-600">오마이치가 사주로 골라준 오늘의 여행지</div>' +
              '<div class="mt-2 flex flex-wrap items-end justify-between gap-3">' +
                '<div>' +
                  '<div class="text-sm font-medium text-ink-soft">' + escapeHtml(r.recommended_destination.country) + '</div>' +
                  '<h3 class="text-2xl font-bold text-ink sm:text-3xl">' + escapeHtml(r.recommended_destination.city) + '</h3>' +
                  '<div class="mt-1 inline-flex rounded-full bg-brand-100 px-2.5 py-1 text-xs font-semibold text-brand-700">' + escapeHtml(r.recommended_destination.vibe) + '</div>' +
                '</div>' +
                '<div class="shrink-0 text-right">' +
                  renderStars(r.recommended_destination.match_score, "md") +
                  '<div class="mt-0.5 text-xs text-ink-soft">매치 ' + r.recommended_destination.match_score + ' / 5</div>' +
                '</div>' +
              '</div>' +
              '<p class="mt-4 rounded-xl bg-white/70 p-3 text-sm leading-relaxed text-ink sm:text-base">' + escapeHtml(r.recommended_destination.reason) + '</p>' +
              '<dl class="mt-4 space-y-3 text-sm sm:text-base">' +
                '<div><dt class="text-xs font-semibold text-brand-600">추천 시기</dt><dd class="mt-0.5 text-ink">' + escapeHtml(r.recommended_destination.best_period) + '</dd></div>' +
                '<div><dt class="text-xs font-semibold text-brand-600">오늘의 작은 팁</dt><dd class="mt-0.5 text-ink">' + escapeHtml(r.recommended_destination.travel_tip) + '</dd></div>' +
                '<div><dt class="text-xs font-semibold text-brand-600">여행지에서 만날 좋은 일</dt><dd class="mt-0.5 leading-relaxed text-ink">' + escapeHtml(r.recommended_destination.hidden_gem) + '</dd></div>' +
              '</dl>' +
            '</div>' +
            hotelsBlock +
            '<div class="grid grid-cols-3 gap-3">' +
              luckyTile("행운의 색", r.lucky.color) +
              luckyTile("행운의 시간", r.lucky.time) +
              luckyTile("행운의 숫자", r.lucky.number) +
            '</div>' +
            '<div class="rounded-2xl border border-brand-200 bg-brand-50 p-5 sm:p-6">' +
              '<p class="text-sm leading-relaxed text-ink sm:text-base">' + escapeHtml(r.closing_message) + '</p>' +
              '<div class="mt-4 flex flex-col gap-2 sm:flex-row">' +
                '<button type="button" data-action="again" class="inline-flex h-12 items-center justify-center rounded-xl bg-brand-600 px-5 text-sm font-bold text-white shadow-sm transition hover:bg-brand-700 sm:text-base">다른 사주로 다시 보기</button>' +
                '<button type="button" data-action="reset" class="inline-flex h-12 items-center justify-center rounded-xl border border-slate-200 bg-white px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">처음으로</button>' +
              '</div>' +
            '</div>' +
          '</section>';
      }

      function render() {
        const root = document.getElementById("app");
        let html;
        if (state.view === "input") html = renderInput();
        else if (state.view === "loading") html = renderLoading();
        else html = renderResult();
        root.innerHTML = html;
        bind();
      }

      function bind() {
        const root = document.getElementById("app");
        const n = root.querySelector("#name-input");
        if (n) {
          n.addEventListener("input", function (e) { setField("name", e.target.value); });
          n.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && state.input.name.trim() && state.input.birthdate.trim()) {
              e.preventDefault();
              ask();
            }
          });
        }
        const b = root.querySelector("#birthdate-input");
        if (b) {
          b.addEventListener("input", function (e) { setField("birthdate", e.target.value); });
          b.addEventListener("change", function (e) { setField("birthdate", e.target.value); });
        }
        root.addEventListener("click", function (e) {
          const t = e.target.closest("[data-action]");
          if (!t) return;
          const a = t.getAttribute("data-action");
          if (a === "hour") setBirthtime(t.getAttribute("data-value"));
          else if (a === "submit") ask();
          else if (a === "again") again();
          else if (a === "reset") reset();
        });
      }

      render();
    </script>
  </body>
</html>
