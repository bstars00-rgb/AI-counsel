    <script>
      /* ================================================================== */
      /* 상태                                                                */
      /* ================================================================== */
      const STORAGE_KEY = "travelshow.history.v1";
      const MAX_HISTORY = 5;

      const state = {
        // home | input | loading | answer | staff | fortune-input | fortune-loading | fortune-result
        view: "home",
        question: "",
        result: null,
        note: "",
        copyMsg: null,
        history: loadHistory(),
        // 멀티턴 대화 이력 (Claude messages 형식)
        turns: [],
        // 누적 질문 표시용
        questionTrail: [],
        // Follow-up 입력 박스 텍스트
        followUpInput: "",
        // 운세
        fortuneInput: { name: "", birthdate: "" },
        fortuneResult: null,
        fortuneError: null,
      };

      const QUICK_QUESTIONS = [
        "초등학생 아이 2명과 다낭 4박 5일 가족여행 추천해줘",
        "부모님 모시고 갈 일본 온천 4박 5일 효도여행 추천해줘",
        "직장인 3박 4일 오사카 자유여행 일정 추천해줘",
        "1인 80만원 예산으로 동남아 휴양 3박 5일 추천해줘",
        "제주 호텔 위주 3박 4일 여행 일정 추천해줘",
        "신혼부부 5박 7일 동남아 허니문 리조트 추천해줘",
        "푸꾸옥 vs 나트랑, 가족여행으로 어디가 더 좋아?",
        "1인 100만원 이하로 갈 만한 4박 5일 해외 여행 추천해줘",
      ];

      /* ================================================================== */
      /* Mock 응답 생성                                                      */
      /* ================================================================== */
      function buildMockResponse(question, history) {
        const q = (question || "").trim();
        const isFollowUp = (history || []).length > 0;
        const lower = q.toLowerCase();
        const isFamily = q.includes("아이") || q.includes("가족") || q.includes("초등");
        const isParents =
          q.includes("부모님") || q.includes("효도") || q.includes("어머니") || q.includes("아버지");
        const isHoneymoon = q.includes("허니문") || q.includes("신혼");
        const isJapan =
          q.includes("일본") || q.includes("오사카") || q.includes("도쿄") || q.includes("후쿠오카");
        const isJeju = q.includes("제주");
        const isDanang = q.includes("다낭");
        const isPhuquoc = q.includes("푸꾸옥") || lower.includes("phu");
        const isNhatrang = q.includes("나트랑") || q.includes("나짱");

        let destination = "동남아 휴양지";
        let travelType = "휴양 여행";
        if (isJapan) destination = "일본";
        else if (isJeju) destination = "제주";
        else if (isDanang) destination = "베트남 다낭";
        else if (isPhuquoc && isNhatrang) destination = "베트남 푸꾸옥/나트랑 비교";
        else if (isPhuquoc) destination = "베트남 푸꾸옥";
        else if (isNhatrang) destination = "베트남 나트랑";

        if (isFamily) travelType = "가족여행";
        else if (isParents) travelType = "효도여행";
        else if (isHoneymoon) travelType = "허니문";

        // 후속 질문 키워드 감지
        const wantsCheaper = q.includes("저렴") || q.includes("싸") || q.includes("줄이") || q.includes("낮춰") || q.includes("낮추");
        const wantsPremium = q.includes("프리미엄") || q.includes("럭셔리") || q.includes("올인");
        const wantsRainy = q.includes("우기") || q.includes("비");

        const summaryPrefix = isFollowUp ? "추가로 알려주신 조건을 반영해서 다시 정리해드릴게요. " : "";

        return {
          customer_question: q || "여행 추천을 요청하셨습니다.",
          customer_answer: {
            summary: summaryPrefix + `${destination} 방향의 ${travelType}을 알아보고 계신 것으로 이해했어요.`,
            recommendation_direction: wantsCheaper
              ? `예산을 낮춰도 만족도가 높은 ${destination} 지역과 시즌 오프 일정을 추천드려요. 4성 호텔 + 직항 비수기 조합이 가성비가 좋습니다.`
              : wantsPremium
                ? `프리미엄 옵션으로 ${destination}의 5성급 풀빌라/오션뷰 리조트 + 다이닝 패키지를 추천드려요.`
                : `편안하게 쉬면서도 인기 명소를 함께 즐길 수 있는 ${destination} 일정을 추천드려요. 이동이 짧고 한국인 편의시설이 잘 갖춰진 지역 위주로 잡으면 만족도가 높습니다.`,
            suggested_itinerary_or_style: wantsPremium
              ? "5박 7일 / 5성급 리조트 + 프라이빗 다이닝 + 헬리투어 1회"
              : wantsCheaper
                ? "3박 4일 / 4성 호텔 비수기 + 자유일정 위주"
                : "3박 5일 / 호텔 또는 리조트 중심 + 반나절 시내 투어 1회",
            estimated_budget_range: wantsCheaper
              ? "1인 60~90만원대 (비수기/4성 기준)"
              : wantsPremium
                ? "1인 200~280만원대 (5성 풀빌라 기준)"
                : isHoneymoon
                  ? "1인 130~180만원대 (5성급 리조트 기준, 시즌에 따라 변동)"
                  : isFamily
                    ? "1인 90~140만원대 (4성 패밀리 리조트 기준)"
                    : "1인 80~120만원대 (4~5성 호텔 기준)",
            advantages: [
              "직항편이 있어 이동이 편안합니다",
              "한국어 서비스가 가능한 호텔/리조트 선택이 가능합니다",
              "기후가 안정적이라 일정 변동 부담이 적습니다",
              isFamily
                ? "키즈클럽/풀빌라 옵션이 다양합니다"
                : "휴양과 관광의 균형이 좋은 일정으로 구성할 수 있습니다",
            ],
            cautions: [
              wantsRainy
                ? "우기에는 오후 스콜이 잦아 실내 옵션을 함께 챙기시면 좋아요"
                : "성수기에는 항공/숙박 가격이 빠르게 오릅니다",
              "여권 유효기간 6개월 이상이 필요합니다",
              "현지 환율과 카드 사용 가능 여부는 출발 전 확인 권장",
            ],
            next_message_to_customer: isFollowUp
              ? "조정해드린 방향으로 상담원에게 이어서 상담받아보세요. 출발일과 인원이 확정되면 더 빠르게 견적을 잡아드릴 수 있어요."
              : "이 방향이 마음에 드시면, 상담원에게 이어서 상담받아보세요. 출발 날짜와 인원만 알려주시면 더 정확한 견적을 안내해드릴 수 있어요.",
          },
          staff_summary: {
            destination_interest: destination,
            travel_type: travelType,
            travelers: isFamily ? "성인 2 + 아동 1~2 추정 (확인 필요)" : "미확인",
            duration: "3박 5일 추정 (미확인)",
            budget_hint: wantsCheaper
              ? "가성비 선호 — 60~90만원대"
              : wantsPremium
                ? "프리미엄 선호 — 200만원 이상"
                : isHoneymoon
                  ? "프리미엄 선호 추정"
                  : "중상 가격대 추정 (미확인)",
            key_needs: [
              travelType,
              wantsCheaper ? "가성비" : "균형",
              wantsPremium ? "프리미엄" : "직항 선호",
              isFamily ? "키즈프렌들리" : "휴양 중심",
              "한국인 응대",
            ],
            missing_information: [
              "정확한 출발일/복귀일",
              "정확한 인원 및 연령",
              wantsCheaper || wantsPremium ? "여행 우선순위 (가격 vs 경험)" : "1인/총 예산 한도",
              "비행기 직항/경유 선호",
              "호텔 등급 선호",
            ],
            booking_probability: isFollowUp ? "High" : "Medium",
            recommended_consulting_direction: isFollowUp
              ? "고객이 후속 조건을 명확히 해주셨으니, 해당 조건에 맞는 항공+호텔 패키지 2~3개를 바로 비교 제안해주세요."
              : "고객이 직접 입력해주신 키워드 위주로 가격대/등급을 확인한 뒤, 출발일 가용 항공편부터 잡고 호텔 옵션을 3개 정도 비교 제안해주세요.",
          },
          staff_questions: isFollowUp
            ? [
                "확정 가능한 출발일이 정해지셨나요?",
                "지금 알려주신 예산이 1인 기준인지 전체 기준인지요?",
                "추가로 결정 시 가장 중요한 포인트는 무엇인가요? (가격/일정/등급)",
                "함께 가시는 분 중 멀미/식이 등 특이사항 있으세요?",
              ]
            : [
                "출발 가능한 날짜는 언제이신가요?",
                "총 몇 분이 함께 가시나요? (아이가 있다면 나이도 함께)",
                "1인 또는 전체 예산은 대략 어느 정도 생각하고 계세요?",
                "직항을 꼭 원하시는지, 경유라도 괜찮은지요?",
                "호텔/리조트 등급은 어느 정도를 선호하시나요?",
              ],
          staff_opening_script:
            "안녕하세요, 트래블쇼 방문해주셔서 감사합니다. 오마이치 AI가 1차로 추천드린 방향 보셨죠? 제가 이어서 출발일과 인원만 먼저 확인하면, 바로 가능한 항공과 호텔 옵션을 골라 비교해드릴게요.",
          follow_up_suggestions: isFollowUp
            ? [
                "다른 지역도 같이 비교해줘",
                "더 한적한 곳을 원해",
                "여행 기간을 늘리면?",
                "기내식/좌석 등급도 안내해줘",
              ]
            : isFamily
              ? [
                  "예산을 1인 60만원 이하로 낮추면?",
                  "아이가 5세 미만이라면?",
                  "키즈클럽이 좋은 리조트 추천해줘",
                  "우기 피하려면 언제 가야 해?",
                  "더 한적한 가족여행지도 알려줘",
                ]
              : isHoneymoon
                ? [
                    "프라이빗 풀빌라 추천해줘",
                    "포토스팟이 많은 곳은?",
                    "5박 이상 일정으로 늘리면?",
                    "신혼 특전 받을 수 있는 곳은?",
                  ]
                : [
                    "예산을 더 낮추면 어떤 옵션이 있어?",
                    "프리미엄 등급으로 올리면?",
                    "다른 지역도 비교해줘",
                    "우기와 건기 추천 시기는?",
                    "직항 비행 시간이 얼마나 돼?",
                  ],
        };
      }

      /* ================================================================== */
      /* Mock 운세 데이터                                                    */
      /* ================================================================== */
      function seedHash(s) {
        let h = 5381;
        for (let i = 0; i < s.length; i++) h = (h * 33) ^ s.charCodeAt(i);
        return Math.abs(h);
      }
      function pickFrom(arr, seed) {
        return arr[seed % arr.length];
      }
      function scoreFromSeed(seed, min, max) {
        min = min == null ? 3 : min;
        max = max == null ? 5 : max;
        return min + (seed % (max - min + 1));
      }

      const FORTUNE_HEADLINES = [
        "새로운 발견이 기다리는 하루",
        "마음의 나침반이 또렷해지는 날",
        "익숙한 길 위에서 만나는 작은 행운",
        "햇살처럼 부드러운 인연이 다가오는 날",
        "오늘만큼은 망설임 없이 떠나도 좋은 날",
        "조용한 풍경 속에서 빛나는 하루",
        "여행 가방을 가볍게 꾸리고 싶은 날",
        "잊고 있던 설렘이 깨어나는 하루",
      ];
      const FORTUNE_SUMMARIES = [
        "{name} 님, 오늘은 평소 관심 두지 않던 풍경에 마음이 끌리는 날이에요. 작은 결심 하나가 여행의 방향을 바꿔놓을지도 몰라요.",
        "{name} 님, 오늘은 평온 속에 숨은 기회를 발견하기 좋은 날이에요. 서두르기보다 한 박자 천천히 움직여 보세요.",
        "{name} 님, 오늘은 익숙한 풍경에서도 새로운 영감을 발견할 수 있어요. 카메라보다 마음으로 먼저 담아보세요.",
        "{name} 님, 오늘은 작은 친절이 큰 인연이 되는 날이에요. 여행 같은 일상을 만끽해 보세요.",

      function findHotelsForCities(cityEnList, limit) {
        if (limit == null) limit = 3;
        const seen = new Set();
        const out = [];
        for (const c of cityEnList) {
          const list = HOTELS_BY_CITY[c] || [];
          for (const h of list) {
            if (seen.has(h.code)) continue;
            seen.add(h.code);
            out.push(h);
          }
        }
        out.sort((a, b) => a.rank - b.rank);
        return out.slice(0, limit);
      }

      function buildMockFortune(input) {
        const today = new Date().toISOString().slice(0, 10);
        const seed = seedHash(input.name + "|" + input.birthdate + "|" + today);
        const overall = scoreFromSeed(seed, 3, 5);
        const sTravel = scoreFromSeed(seed >> 1, 3, 5);
        const sMoney = scoreFromSeed(seed >> 2, 3, 5);
        const sLove = scoreFromSeed(seed >> 3, 3, 5);
        const sHealth = scoreFromSeed(seed >> 4, 3, 5);
        const dest = pickFrom(DESTINATIONS, seed >> 5);
        const destScore = scoreFromSeed(seed >> 6, 4, 5); // 추천한 곳이니 살짝 후하게
        const vibeKeyword = pickFrom(VIBE_KEYWORDS, seed >> 7);
        const reason = "오늘 " + input.name + " 님의 흐름은 " + vibeKeyword + " 결이라서, " + dest.city + "의 " + dest.vibe + " 분위기가 잘 어울려요.";
        const summaryTpl = pickFrom(FORTUNE_SUMMARIES, seed >> 8);
        return {
          name: input.name,
          headline: pickFrom(FORTUNE_HEADLINES, seed >> 9),
          overall_score: overall,
          fortune_summary: summaryTpl.replace("{name}", input.name),
          categories: [
            { label: "여행운", score: sTravel, message: pickFrom(FORTUNE_CAT_MSGS["여행운"][sTravel], seed >> 14) },
            { label: "재물운", score: sMoney, message: pickFrom(FORTUNE_CAT_MSGS["재물운"][sMoney], seed >> 15) },
            { label: "인연운", score: sLove, message: pickFrom(FORTUNE_CAT_MSGS["인연운"][sLove], seed >> 16) },
            { label: "건강운", score: sHealth, message: pickFrom(FORTUNE_CAT_MSGS["건강운"][sHealth], seed >> 17) },
          ],
          recommended_destination: {
            country: dest.country,
            city: dest.city,
            vibe: dest.vibe,
            match_score: destScore,
            reason: reason,
            best_period: dest.period,
            travel_tip: dest.tip,
            hidden_gem: dest.gem,
          },
          recommended_hotels: findHotelsForCities(dest.hotelCities || [], 3),
          lucky: {
            color: pickFrom(LUCKY_COLORS, seed >> 11),
            time: pickFrom(LUCKY_TIMES, seed >> 12),
            number: pickFrom(LUCKY_NUMBERS, seed >> 13),
          },
          closing_message: pickFrom(FORTUNE_CLOSINGS, seed >> 10).replace("{country}", dest.city),
        };
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.slice(0, MAX_HISTORY) : [];
        } catch {
          return [];
        }
      }
      function saveHistory(item) {
        const next = [item, ...state.history.filter((h) => h.id !== item.id)].slice(
          0,
          MAX_HISTORY,
        );
        state.history = next;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        } catch {}
      }
      function updateHistoryNote(id, newNote) {
        state.history = state.history.map((h) => (h.id === id ? { ...h, note: newNote } : h));
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
        } catch {}
      }

      /* 동작                                                                */
      /* ================================================================== */
      function ask(raw, opts) {
        opts = opts || {};
        const isFollowUp = !!opts.isFollowUp;
        const q = (raw != null
          ? raw
          : isFollowUp
            ? state.followUpInput
            : state.question
        ).trim();
        if (!q) return;

        if (!isFollowUp) {
          state.question = q;
          state.note = "";
          state.questionTrail = [q];
        } else {
          state.questionTrail = state.questionTrail.concat([q]);
        }
        state.followUpInput = "";
        state.view = "loading";
        state.copyMsg = null;
        render();

        const requestHistory = isFollowUp ? state.turns : [];

        // 0.7~1.2초 지연으로 실제 API 호출처럼 보이게
        const delay = 700 + Math.random() * 500;
        setTimeout(() => {
          const data = buildMockResponse(q, requestHistory);
          state.result = data;
          state.view = "answer";

          // 멀티턴 history 갱신
          state.turns = requestHistory.concat([
            { role: "user", content: q },
            { role: "assistant", content: JSON.stringify(data) },
          ]);

          if (!isFollowUp) {
            saveHistory({
              id: String(Date.now()),
              createdAt: new Date().toISOString(),
              question: q,
              response: data,
            });
          } else if (state.history.length > 0) {
            // 직전 세션의 최신 결과로 갱신
            const latest = state.history[0];
            const updated = Object.assign({}, latest, { response: data });
            state.history = [updated].concat(state.history.slice(1));
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
            } catch {}
          }
          render();
        }, delay);
      }

      function askFortune() {
        const name = (state.fortuneInput.name || "").trim();
        const birthdate = (state.fortuneInput.birthdate || "").trim();
        if (!name || !birthdate) {
          state.fortuneError = "이름과 생년월일을 모두 입력해주세요.";
          render();
          return;
        }
        state.fortuneError = null;
        state.view = "fortune-loading";
        render();
        const delay = 700 + Math.random() * 500;
        setTimeout(() => {
          state.fortuneResult = buildMockFortune({ name, birthdate });
          state.view = "fortune-result";
          render();
        }, delay);
      }

        state.fortuneResult = null;

      function consultFromFortune() {
        // 오마이치가 추천한 도시를 상담 질문으로 자동 prefill
        const dest = state.fortuneResult && state.fortuneResult.recommended_destination;
        if (dest && dest.city) state.question = dest.city + " 여행을 추천해줘";
        state.view = "input";

      function copyAnswer() {
        if (!state.result) return;
        const a = state.result.customer_answer;
        const text = [
          "[고객 질문]",
          state.result.customer_question,
          "",
          "[요약]",
          a.summary,
          "",
          "[추천 방향]",

          "",
          "[추천 일정 / 스타일]",
          a.suggested_itinerary_or_style,
          "",
          "[예상 예산대]",
          a.estimated_budget_range,
          "",
          "[장점]",
          ...a.advantages.map((v) => "- " + v),
          "",
          "[주의사항]",
          ...a.cautions.map((v) => "- " + v),
          "",
          a.next_message_to_customer,
        ].join("\n");

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              state.copyMsg = "답변이 복사되었습니다.";
              render();
              setTimeout(() => {
                state.copyMsg = null;
                render();
              }, 2000);
            })
            .catch(() => {
              state.copyMsg = "복사에 실패했습니다.";
              render();
              setTimeout(() => {
                state.copyMsg = null;
                render();
              }, 2000);
            });
        } else {
          state.copyMsg = "이 브라우저는 클립보드를 지원하지 않습니다.";
          render();
        }
      }

      function loadHistoryItem(id) {
        const h = state.history.find((x) => x.id === id);
        if (!h) return;
        state.question = h.question;

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
      function probColor(p) {
        if (p === "High") return "bg-emerald-100 text-emerald-700";
        if (p === "Medium") return "bg-amber-100 text-amber-700";
        return "bg-slate-200 text-slate-700";
      }

      /* 렌더링                                                              */
      /* ================================================================== */
      function render() {
        const root = document.getElementById("app");
        let html = "";
        if (state.view === "home") html = renderHome();
        else if (state.view === "input") html = renderInput();
        else if (state.view === "loading") html = renderLoading();
        else if (state.view === "fortune-input") html = renderFortuneInput();
        else if (state.view === "fortune-loading") html = renderFortuneLoading();
        else if (state.view === "fortune-result") html = renderFortuneResult();
        else html = renderResult();
        root.innerHTML = html;
        bindEvents();
      }

        const root = document.getElementById("app");

        // 입력창
        const q = root.querySelector("#question-input");
        if (q) {
          q.addEventListener("input", (e) => {
            state.question = e.target.value;
            const cc = root.querySelector("#char-count");
            if (cc) cc.textContent = state.question.length + " / 2000";
            const btn = root.querySelector('[data-action="ask"]');
            if (btn) {
              if (state.question.trim()) btn.removeAttribute("disabled");
              else btn.setAttribute("disabled", "");
            }
          });
          q.addEventListener("keydown", (e) => {
            // Ctrl/Cmd + Enter 로 빠르게 제출
            if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
              e.preventDefault();
              ask();
            }
          });
        }

        // 메모
        const note = root.querySelector("#note-input");
        if (note) {
          note.addEventListener("input", (e) => setNote(e.target.value));
        }

        // 운세 - 이름 입력
        const fortuneName = root.querySelector("#fortune-name");
        if (fortuneName) {
          fortuneName.addEventListener("input", (e) => setFortuneField("name", e.target.value));
        }
        // 운세 - 생년월일 입력
        const fortuneBirth = root.querySelector("#fortune-birthdate");
        if (fortuneBirth) {
          fortuneBirth.addEventListener("input", (e) => setFortuneField("birthdate", e.target.value));
          fortuneBirth.addEventListener("change", (e) => setFortuneField("birthdate", e.target.value));
        }

        // Follow-up 입력창
        const followInput = root.querySelector("#follow-up-input");
        if (followInput) {
          followInput.addEventListener("input", (e) => {
            state.followUpInput = e.target.value;
            const btn = root.querySelector('[data-action="follow-up-submit"]');
            if (btn) {
              if (state.followUpInput.trim()) btn.removeAttribute("disabled");
              else btn.setAttribute("disabled", "");
            }
          });
          followInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && state.followUpInput.trim()) {
              e.preventDefault();
              ask(null, { isFollowUp: true });
            }
          });
        }

        // 버튼 위임
        root.addEventListener("click", (e) => {
          const target = e.target.closest("[data-action]");
          if (!target) return;
          const action = target.getAttribute("data-action");
          switch (action) {
            case "ask":
              ask();
              break;
            case "quick":
              ask(target.getAttribute("data-question"));
              break;
            case "show-answer":
              state.view = "answer";
              render();
              break;
            case "show-staff":
              state.view = "staff";
              render();
              break;
            case "reset":
              reset();
              break;
            case "copy":
              copyAnswer();
              break;
            case "load-history":
              loadHistoryItem(target.getAttribute("data-id"));
              break;
            case "follow-up-chip":
              ask(target.getAttribute("data-question"), { isFollowUp: true });
              break;
            case "follow-up-submit":
              if (state.followUpInput.trim()) {
                ask(null, { isFollowUp: true });
              }
              break;
            case "back-home":
              goHome();
              break;
            case "start-fortune":
              startFortune();
              break;
            case "start-consult":
              startConsult();
              break;
            case "fortune-submit":
              askFortune();
              break;
            case "fortune-again":
              againFortune();
              break;
            case "fortune-consult":
              consultFromFortune();
              break;
          }
        });
      }

      render();
    </script>
  </body>
</html>
