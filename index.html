    <script>
      /* ================================================================== */
      /* 상태                                                                */
      /* ================================================================== */
      const STORAGE_KEY = "travelshow.history.v1";
      const MAX_HISTORY = 5;

      const state = {
        view: "input", // input | loading | answer | staff
        question: "",
        result: null,
        note: "",
        copyMsg: null,
        history: loadHistory(),
        // 멀티턴 대화 이력 (Claude messages 형식)
        turns: [],
        // 누적 질문 표시용
        questionTrail: [],
        // Follow-up 입력 박스 텍스트
        followUpInput: "",
      };

      const QUICK_QUESTIONS = [
        "초등학생 아이 2명과 다낭 4박 5일 가족여행 추천해줘",
        "부모님 모시고 갈 일본 온천 4박 5일 효도여행 추천해줘",
        "직장인 3박 4일 오사카 자유여행 일정 추천해줘",
        "1인 80만원 예산으로 동남아 휴양 3박 5일 추천해줘",
        "제주 호텔 위주 3박 4일 여행 일정 추천해줘",
        "신혼부부 5박 7일 동남아 허니문 리조트 추천해줘",
        "푸꾸옥 vs 나트랑, 가족여행으로 어디가 더 좋아?",
        "1인 100만원 이하로 갈 만한 4박 5일 해외 여행 추천해줘",
      ];

      /* ================================================================== */
      /* Mock 응답 생성                                                      */
      /* ================================================================== */
      function buildMockResponse(question, history) {
        const q = (question || "").trim();
        const isFollowUp = (history || []).length > 0;
        const lower = q.toLowerCase();
        const isFamily = q.includes("아이") || q.includes("가족") || q.includes("초등");
        const isParents =
          q.includes("부모님") || q.includes("효도") || q.includes("어머니") || q.includes("아버지");
        const isHoneymoon = q.includes("허니문") || q.includes("신혼");
        const isJapan =
          q.includes("일본") || q.includes("오사카") || q.includes("도쿄") || q.includes("후쿠오카");
        const isJeju = q.includes("제주");
        const isDanang = q.includes("다낭");
        const isPhuquoc = q.includes("푸꾸옥") || lower.includes("phu");
        const isNhatrang = q.includes("나트랑") || q.includes("나짱");

        let destination = "동남아 휴양지";
        let travelType = "휴양 여행";
        if (isJapan) destination = "일본";
        else if (isJeju) destination = "제주";
        else if (isDanang) destination = "베트남 다낭";
        else if (isPhuquoc && isNhatrang) destination = "베트남 푸꾸옥/나트랑 비교";
        else if (isPhuquoc) destination = "베트남 푸꾸옥";
        else if (isNhatrang) destination = "베트남 나트랑";

        if (isFamily) travelType = "가족여행";
        else if (isParents) travelType = "효도여행";
        else if (isHoneymoon) travelType = "허니문";

        // 후속 질문 키워드 감지
        const wantsCheaper = q.includes("저렴") || q.includes("싸") || q.includes("줄이") || q.includes("낮춰") || q.includes("낮추");
        const wantsPremium = q.includes("프리미엄") || q.includes("럭셔리") || q.includes("올인");
        const wantsRainy = q.includes("우기") || q.includes("비");

        const summaryPrefix = isFollowUp ? "추가로 알려주신 조건을 반영해서 다시 정리해드릴게요. " : "";

        return {
          customer_question: q || "여행 추천을 요청하셨습니다.",
          customer_answer: {
            summary: summaryPrefix + `${destination} 방향의 ${travelType}을 알아보고 계신 것으로 이해했어요.`,
            recommendation_direction: wantsCheaper
              ? `예산을 낮춰도 만족도가 높은 ${destination} 지역과 시즌 오프 일정을 추천드려요. 4성 호텔 + 직항 비수기 조합이 가성비가 좋습니다.`
              : wantsPremium
                ? `프리미엄 옵션으로 ${destination}의 5성급 풀빌라/오션뷰 리조트 + 다이닝 패키지를 추천드려요.`
                : `편안하게 쉬면서도 인기 명소를 함께 즐길 수 있는 ${destination} 일정을 추천드려요. 이동이 짧고 한국인 편의시설이 잘 갖춰진 지역 위주로 잡으면 만족도가 높습니다.`,
            suggested_itinerary_or_style: wantsPremium
              ? "5박 7일 / 5성급 리조트 + 프라이빗 다이닝 + 헬리투어 1회"
              : wantsCheaper
                ? "3박 4일 / 4성 호텔 비수기 + 자유일정 위주"
                : "3박 5일 / 호텔 또는 리조트 중심 + 반나절 시내 투어 1회",
            estimated_budget_range: wantsCheaper
              ? "1인 60~90만원대 (비수기/4성 기준)"
              : wantsPremium
                ? "1인 200~280만원대 (5성 풀빌라 기준)"
                : isHoneymoon
                  ? "1인 130~180만원대 (5성급 리조트 기준, 시즌에 따라 변동)"
                  : isFamily
                    ? "1인 90~140만원대 (4성 패밀리 리조트 기준)"
                    : "1인 80~120만원대 (4~5성 호텔 기준)",
            advantages: [
              "직항편이 있어 이동이 편안합니다",
              "한국어 서비스가 가능한 호텔/리조트 선택이 가능합니다",
              "기후가 안정적이라 일정 변동 부담이 적습니다",
              isFamily
                ? "키즈클럽/풀빌라 옵션이 다양합니다"
                : "휴양과 관광의 균형이 좋은 일정으로 구성할 수 있습니다",
            ],
            cautions: [
              wantsRainy
                ? "우기에는 오후 스콜이 잦아 실내 옵션을 함께 챙기시면 좋아요"
                : "성수기에는 항공/숙박 가격이 빠르게 오릅니다",
              "여권 유효기간 6개월 이상이 필요합니다",
              "현지 환율과 카드 사용 가능 여부는 출발 전 확인 권장",
            ],
            next_message_to_customer: isFollowUp
              ? "조정해드린 방향으로 상담원에게 이어서 상담받아보세요. 출발일과 인원이 확정되면 더 빠르게 견적을 잡아드릴 수 있어요."
              : "이 방향이 마음에 드시면, 상담원에게 이어서 상담받아보세요. 출발 날짜와 인원만 알려주시면 더 정확한 견적을 안내해드릴 수 있어요.",
          },
          staff_summary: {
            destination_interest: destination,
            travel_type: travelType,
            travelers: isFamily ? "성인 2 + 아동 1~2 추정 (확인 필요)" : "미확인",
            duration: "3박 5일 추정 (미확인)",
            budget_hint: wantsCheaper
              ? "가성비 선호 — 60~90만원대"
              : wantsPremium
                ? "프리미엄 선호 — 200만원 이상"
                : isHoneymoon
                  ? "프리미엄 선호 추정"
                  : "중상 가격대 추정 (미확인)",
            key_needs: [
              travelType,
              wantsCheaper ? "가성비" : "균형",
              wantsPremium ? "프리미엄" : "직항 선호",
              isFamily ? "키즈프렌들리" : "휴양 중심",
              "한국인 응대",
            ],
            missing_information: [
              "정확한 출발일/복귀일",
              "정확한 인원 및 연령",
              wantsCheaper || wantsPremium ? "여행 우선순위 (가격 vs 경험)" : "1인/총 예산 한도",
              "비행기 직항/경유 선호",
              "호텔 등급 선호",
            ],
            booking_probability: isFollowUp ? "High" : "Medium",
            recommended_consulting_direction: isFollowUp
              ? "고객이 후속 조건을 명확히 해주셨으니, 해당 조건에 맞는 항공+호텔 패키지 2~3개를 바로 비교 제안해주세요."
              : "고객이 직접 입력해주신 키워드 위주로 가격대/등급을 확인한 뒤, 출발일 가용 항공편부터 잡고 호텔 옵션을 3개 정도 비교 제안해주세요.",
          },
          staff_questions: isFollowUp
            ? [
                "확정 가능한 출발일이 정해지셨나요?",
                "지금 알려주신 예산이 1인 기준인지 전체 기준인지요?",
                "추가로 결정 시 가장 중요한 포인트는 무엇인가요? (가격/일정/등급)",
                "함께 가시는 분 중 멀미/식이 등 특이사항 있으세요?",
              ]
            : [
                "출발 가능한 날짜는 언제이신가요?",
                "총 몇 분이 함께 가시나요? (아이가 있다면 나이도 함께)",
                "1인 또는 전체 예산은 대략 어느 정도 생각하고 계세요?",
                "직항을 꼭 원하시는지, 경유라도 괜찮은지요?",
                "호텔/리조트 등급은 어느 정도를 선호하시나요?",
              ],
          staff_opening_script:
            "안녕하세요, 트래블쇼 방문해주셔서 감사합니다. 오마이치 AI가 1차로 추천드린 방향 보셨죠? 제가 이어서 출발일과 인원만 먼저 확인하면, 바로 가능한 항공과 호텔 옵션을 골라 비교해드릴게요.",
          follow_up_suggestions: isFollowUp
            ? [
                "다른 지역도 같이 비교해줘",
                "더 한적한 곳을 원해",
                "여행 기간을 늘리면?",
                "기내식/좌석 등급도 안내해줘",
              ]
            : isFamily
              ? [
                  "예산을 1인 60만원 이하로 낮추면?",
                  "아이가 5세 미만이라면?",
                  "키즈클럽이 좋은 리조트 추천해줘",
                  "우기 피하려면 언제 가야 해?",
                  "더 한적한 가족여행지도 알려줘",
                ]
              : isHoneymoon
                ? [
                    "프라이빗 풀빌라 추천해줘",
                    "포토스팟이 많은 곳은?",
                    "5박 이상 일정으로 늘리면?",
                    "신혼 특전 받을 수 있는 곳은?",
                  ]
                : [
                    "예산을 더 낮추면 어떤 옵션이 있어?",
                    "프리미엄 등급으로 올리면?",
                    "다른 지역도 비교해줘",
                    "우기와 건기 추천 시기는?",
                    "직항 비행 시간이 얼마나 돼?",
                  ],
        };
      }

      /* ================================================================== */
      /* LocalStorage                                                        */
      /* ================================================================== */
      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed.slice(0, MAX_HISTORY) : [];
        } catch {
          return [];
        }
      }
      function saveHistory(item) {
        const next = [item, ...state.history.filter((h) => h.id !== item.id)].slice(
          0,
          MAX_HISTORY,
        );
        state.history = next;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
        } catch {}
      }
      function updateHistoryNote(id, newNote) {
        state.history = state.history.map((h) => (h.id === id ? { ...h, note: newNote } : h));
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
        } catch {}
      }

      /* ================================================================== */
      /* 동작                                                                */
      /* ================================================================== */
      function ask(raw, opts) {
        opts = opts || {};
        const isFollowUp = !!opts.isFollowUp;
        const q = (raw != null
          ? raw
          : isFollowUp
            ? state.followUpInput
            : state.question
        ).trim();
        if (!q) return;

        if (!isFollowUp) {
          state.question = q;
          state.note = "";
          state.questionTrail = [q];
        } else {
          state.questionTrail = state.questionTrail.concat([q]);
        }
        state.followUpInput = "";
        state.view = "loading";
        state.copyMsg = null;
        render();

        const requestHistory = isFollowUp ? state.turns : [];

        // 0.7~1.2초 지연으로 실제 API 호출처럼 보이게
        const delay = 700 + Math.random() * 500;
        setTimeout(() => {
          const data = buildMockResponse(q, requestHistory);
          state.result = data;
          state.view = "answer";

          // 멀티턴 history 갱신
          state.turns = requestHistory.concat([
            { role: "user", content: q },
            { role: "assistant", content: JSON.stringify(data) },
          ]);

          if (!isFollowUp) {
            saveHistory({
              id: String(Date.now()),
              createdAt: new Date().toISOString(),
              question: q,
              response: data,
            });
          } else if (state.history.length > 0) {
            // 직전 세션의 최신 결과로 갱신
            const latest = state.history[0];
            const updated = Object.assign({}, latest, { response: data });
            state.history = [updated].concat(state.history.slice(1));
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
            } catch {}
          }
          render();
        }, delay);
      }

      function reset() {
        state.view = "input";
        state.question = "";
        state.result = null;
        state.note = "";
        state.copyMsg = null;
        state.turns = [];
        state.questionTrail = [];
        state.followUpInput = "";
        render();
      }

      function copyAnswer() {
        if (!state.result) return;
        const a = state.result.customer_answer;
        const text = [
          "[고객 질문]",
          state.result.customer_question,
          "",
          "[요약]",
          a.summary,
          "",
          "[추천 방향]",
          a.recommendation_direction,
          "",
          "[추천 일정 / 스타일]",
          a.suggested_itinerary_or_style,
          "",
          "[예상 예산대]",
          a.estimated_budget_range,
          "",
          "[장점]",
          ...a.advantages.map((v) => "- " + v),
          "",
          "[주의사항]",
          ...a.cautions.map((v) => "- " + v),
          "",
          a.next_message_to_customer,
        ].join("\n");

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => {
              state.copyMsg = "답변이 복사되었습니다.";
              render();
              setTimeout(() => {
                state.copyMsg = null;
                render();
              }, 2000);
            })
            .catch(() => {
              state.copyMsg = "복사에 실패했습니다.";
              render();
              setTimeout(() => {
                state.copyMsg = null;
                render();
              }, 2000);
            });
        } else {
          state.copyMsg = "이 브라우저는 클립보드를 지원하지 않습니다.";
          render();
        }
      }

      function loadHistoryItem(id) {
        const h = state.history.find((x) => x.id === id);
        if (!h) return;
        state.question = h.question;
        state.result = h.response;
        state.note = h.note || "";
        state.view = "answer";
        // 멀티턴 컨텍스트 재구성 (저장된 결과 위에 후속 질문 이어가기 가능)
        state.turns = [
          { role: "user", content: h.question },
          { role: "assistant", content: JSON.stringify(h.response) },
        ];
        state.questionTrail = [h.question];
        state.followUpInput = "";
        render();
      }

      function setNote(value) {
        state.note = value;
        const latest = state.history[0];
        if (latest && state.result && latest.question === state.result.customer_question) {
          updateHistoryNote(latest.id, value);
        }
        // 노트는 textarea 가 자체 관리하니까 render 안 함
      }

      /* ================================================================== */
      /* Utilities                                                           */
      /* ================================================================== */
      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
      function probColor(p) {
        if (p === "High") return "bg-emerald-100 text-emerald-700";
        if (p === "Medium") return "bg-amber-100 text-amber-700";
        return "bg-slate-200 text-slate-700";
      }

      /* ================================================================== */
      /* 렌더링                                                              */
      /* ================================================================== */
      function render() {
        const root = document.getElementById("app");
        let html = "";
        if (state.view === "input") html = renderInput();
        else if (state.view === "loading") html = renderLoading();
        else html = renderResult();
        root.innerHTML = html;
        bindEvents();
      }

      function renderInput() {
        const quick = QUICK_QUESTIONS.map(
          (q) => `
          <button
            type="button"
            data-action="quick"
            data-question="${escapeHtml(q)}"
            class="rounded-xl border border-brand-100 bg-white px-4 py-3.5 text-left text-sm font-medium leading-relaxed text-slate-700 shadow-sm transition hover:border-brand-400 hover:bg-brand-50 sm:text-base"
          >${escapeHtml(q)}</button>`,
        ).join("");

        const history =
          state.history.length > 0
            ? `
          <div>
            <h2 class="mb-3 text-sm font-semibold text-slate-500">최근 상담 기록 (최대 5건)</h2>
            <ul class="space-y-2">
              ${state.history
                .map(
                  (h) => `
                <li>
                  <button
                    type="button"
                    data-action="load-history"
                    data-id="${escapeHtml(h.id)}"
                    class="block w-full rounded-xl border border-slate-200 bg-white p-4 text-left transition hover:border-brand-300 hover:bg-brand-50"
                  >
                    <div class="text-xs text-slate-400">${escapeHtml(
                      new Date(h.createdAt).toLocaleString("ko-KR"),
                    )}</div>
                    <div class="mt-1 line-clamp-1 text-sm font-medium text-slate-800">${escapeHtml(
                      h.question,
                    )}</div>
                    ${
                      h.note
                        ? `<div class="mt-1 line-clamp-1 text-xs text-brand-600">메모: ${escapeHtml(
                            h.note,
                          )}</div>`
                        : ""
                    }
                  </button>
                </li>`,
                )
                .join("")}
            </ul>
          </div>`
            : "";

        return `
        <section class="space-y-6">
          <div class="rounded-2xl border border-brand-100 bg-white p-6 shadow-sm sm:p-8">
            <label class="block text-base font-semibold text-slate-800 sm:text-lg">
              어떤 여행을 추천해드릴까요?
            </label>
            <textarea
              id="question-input"
              placeholder="예: 초등학생 아이 2명과 다낭 4박 5일 가족여행 추천해주세요"
              rows="4"
              class="mt-3 w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-4 text-base outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-200 sm:text-lg"
            >${escapeHtml(state.question)}</textarea>

            <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
              <span class="text-xs text-slate-400" id="char-count">${state.question.length} / 2000</span>
              <button
                type="button"
                data-action="ask"
                ${state.question.trim() ? "" : "disabled"}
                class="inline-flex h-14 min-w-44 items-center justify-center rounded-xl bg-brand-600 px-6 text-base font-semibold text-white shadow-sm transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-300 sm:text-lg"
              >오마이치에게 물어보기</button>
            </div>
          </div>

          <div>
            <h2 class="mb-3 text-sm font-semibold text-slate-500">빠른 질문 예시</h2>
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">${quick}</div>
          </div>

          ${history}
        </section>
      `;
      }

      function renderLoading() {
        return `
        <section class="rounded-2xl border border-brand-100 bg-white p-10 text-center shadow-sm">
          <div class="mx-auto mb-6 h-12 w-12 rounded-full border-4 border-chi-200 border-t-chi-500 spin"></div>
          <p class="text-lg font-semibold text-slate-800">오마이치 AI가 여행 추천을 준비하고 있어요</p>
          <p class="mt-2 line-clamp-2 text-sm text-slate-500">“${escapeHtml(state.question)}”</p>
        </section>
      `;
      }

      function renderResult() {
        const tabs = `
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" data-action="show-answer" class="rounded-xl px-4 py-2 text-sm font-semibold transition ${
            state.view === "answer"
              ? "bg-brand-600 text-white"
              : "bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-brand-50"
          }">고객 답변 화면</button>
          <button type="button" data-action="show-staff" class="rounded-xl px-4 py-2 text-sm font-semibold transition ${
            state.view === "staff"
              ? "bg-brand-600 text-white"
              : "bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-brand-50"
          }">상담원 화면</button>
        </div>`;

        let card;
        if (state.view === "answer") {
          const trail = state.questionTrail.length > 1 ? renderTrail() : "";
          card = trail + renderCustomerCard() + renderFollowUp();
        } else {
          card = renderStaffCard();
        }

        const actions =
          state.view === "answer"
            ? `
          <button type="button" data-action="show-staff"
            class="inline-flex h-12 items-center justify-center rounded-xl bg-brand-600 px-5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 sm:text-base">
            상담원과 이어서 상담하기 →
          </button>
          <button type="button" data-action="copy"
            class="inline-flex h-12 items-center justify-center rounded-xl border border-slate-200 bg-white px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
            답변 복사
          </button>`
            : `
          <button type="button" data-action="show-answer"
            class="inline-flex h-12 items-center justify-center rounded-xl border border-slate-200 bg-white px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
            ← 고객 답변 다시 보기
          </button>`;

        return `
        <section class="space-y-4">
          ${tabs}
          ${card}
          <div class="flex flex-wrap items-center gap-3 pt-2">
            ${actions}
            <button type="button" data-action="reset"
              class="inline-flex h-12 items-center justify-center rounded-xl border border-slate-200 bg-white px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
              다시 질문하기
            </button>
            ${
              state.copyMsg
                ? `<span class="text-sm font-medium text-brand-600">${escapeHtml(state.copyMsg)}</span>`
                : ""
            }
          </div>
        </section>
      `;
      }

      function renderCustomerCard() {
        const a = state.result.customer_answer;
        return `
        <div class="space-y-4 rounded-2xl border border-brand-100 bg-white p-6 shadow-sm sm:p-8">
          ${section("1. 고객 질문 요약", `
            <p class="text-base leading-relaxed text-slate-700">${escapeHtml(a.summary)}</p>
            <p class="mt-2 text-xs text-slate-400">원문: ${escapeHtml(state.result.customer_question)}</p>
          `)}
          ${section("2. 추천 여행 방향", `
            <p class="text-base leading-relaxed text-slate-700">${escapeHtml(a.recommendation_direction)}</p>
          `)}
          ${section("3. 추천 일정 또는 여행 스타일", `
            <p class="text-base leading-relaxed text-slate-700">${escapeHtml(a.suggested_itinerary_or_style)}</p>
          `)}
          ${section("4. 예상 예산대", `
            <p class="text-base font-semibold leading-relaxed text-brand-700">${escapeHtml(a.estimated_budget_range)}</p>
            <p class="mt-1 text-xs text-slate-400">※ 시즌, 항공편, 호텔 등급에 따라 변동될 수 있습니다.</p>
          `)}
          ${section("5. 장점", `
            <ul class="space-y-1.5">
              ${a.advantages.map((v) => `<li class="flex gap-2 text-base leading-relaxed text-slate-700"><span class="text-brand-500">✓</span><span>${escapeHtml(v)}</span></li>`).join("")}
            </ul>
          `)}
          ${section("6. 주의사항", `
            <ul class="space-y-1.5">
              ${a.cautions.map((v) => `<li class="flex gap-2 text-base leading-relaxed text-slate-700"><span class="text-amber-500">!</span><span>${escapeHtml(v)}</span></li>`).join("")}
            </ul>
          `)}
          ${section("7. 상담원에게 이어서 확인하면 좋은 내용", `
            <p class="rounded-xl bg-brand-50 p-4 text-base leading-relaxed text-slate-800">${escapeHtml(a.next_message_to_customer)}</p>
          `)}
        </div>
      `;
      }

      function renderStaffCard() {
        const s = state.result.staff_summary;
        const kv = (k, v) => `
          <div class="rounded-lg bg-slate-50 px-3 py-2 text-sm">
            <span class="mr-2 font-semibold text-slate-500">${escapeHtml(k)}</span>
            <span class="text-slate-800">${v}</span>
          </div>`;
        return `
        <div class="space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
          ${section("1. 고객 질문 원문", `
            <p class="rounded-xl bg-slate-50 p-3 text-sm text-slate-700">${escapeHtml(state.result.customer_question)}</p>
          `)}
          ${section("2. AI 답변 요약 (고객용)", `
            <p class="text-sm leading-relaxed text-slate-700">${escapeHtml(state.result.customer_answer.summary)} · ${escapeHtml(state.result.customer_answer.estimated_budget_range)}</p>
            <p class="mt-1 text-sm leading-relaxed text-slate-600">${escapeHtml(state.result.customer_answer.recommendation_direction)}</p>
          `)}
          ${section("3. 상담원용 니즈 분석", `
            <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
              ${kv("관심 목적지", escapeHtml(s.destination_interest))}
              ${kv("여행 유형", escapeHtml(s.travel_type))}
              ${kv("인원", escapeHtml(s.travelers))}
              ${kv("일정", escapeHtml(s.duration))}
              ${kv("예산 힌트", escapeHtml(s.budget_hint))}
              ${kv("예약 가능성", `<span class="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold ${probColor(s.booking_probability)}">${escapeHtml(s.booking_probability)}</span>`)}
            </div>
            <div class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
              <div>
                <h4 class="mb-1 text-xs font-semibold text-slate-500">핵심 니즈</h4>
                <div class="flex flex-wrap gap-1.5">
                  ${s.key_needs.map((v) => `<span class="rounded-full bg-brand-50 px-2.5 py-1 text-xs font-medium text-brand-700">${escapeHtml(v)}</span>`).join("")}
                </div>
              </div>
              <div>
                <h4 class="mb-1 text-xs font-semibold text-slate-500">미확인 정보</h4>
                <ul class="list-disc pl-4 text-sm text-slate-700">
                  ${s.missing_information.map((v) => `<li>${escapeHtml(v)}</li>`).join("")}
                </ul>
              </div>
            </div>
            <div class="mt-3">
              <h4 class="mb-1 text-xs font-semibold text-slate-500">추천 상담 방향</h4>
              <p class="rounded-xl bg-slate-50 p-3 text-sm leading-relaxed text-slate-700">${escapeHtml(s.recommended_consulting_direction)}</p>
            </div>
          `)}
          ${section("4. 바로 물어볼 질문", `
            <ol class="list-decimal space-y-1.5 pl-5 text-base text-slate-800">
              ${state.result.staff_questions.map((q) => `<li>${escapeHtml(q)}</li>`).join("")}
            </ol>
          `)}
          ${section("5. 상담 시작 멘트", `
            <p class="rounded-xl border border-brand-100 bg-brand-50 p-4 text-base leading-relaxed text-slate-800">“${escapeHtml(state.result.staff_opening_script)}”</p>
          `)}
          ${section("6. 상담 메모", `
            <textarea id="note-input" rows="4" placeholder="고객 응답, 추천 상품, 다음 액션 등을 메모하세요"
              class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-200">${escapeHtml(state.note)}</textarea>
            <p class="mt-1 text-xs text-slate-400">메모는 자동으로 최근 상담 기록(localStorage)에 저장됩니다.</p>
          `)}
        </div>
      `;
      }

      function section(title, inner) {
        return `<div><h3 class="mb-2 text-sm font-bold text-brand-700">${escapeHtml(title)}</h3>${inner}</div>`;
      }

      function renderTrail() {
        const items = state.questionTrail;
        return `
        <div class="rounded-xl border border-brand-100 bg-brand-50 p-3">
          <div class="mb-1.5 text-xs font-semibold text-brand-700">대화 흐름 (${items.length})</div>
          <ol class="space-y-1 text-sm text-ink">
            ${items
              .map(
                (q, i) => `
              <li class="flex gap-2">
                <span class="shrink-0 font-bold text-brand-600">${i === 0 ? "Q." : "Q" + (i + 1) + "."}</span>
                <span class="leading-relaxed">${escapeHtml(q)}</span>
              </li>`,
              )
              .join("")}
          </ol>
        </div>`;
      }

      function renderFollowUp() {
        const suggestions = (state.result && state.result.follow_up_suggestions) || [];
        const chips =
          suggestions.length > 0
            ? `
          <div class="mb-3 flex flex-wrap gap-2">
            ${suggestions
              .map(
                (s) => `
              <button type="button" data-action="follow-up-chip" data-question="${escapeHtml(s)}"
                class="rounded-full border border-brand-200 bg-brand-50 px-3 py-1.5 text-sm font-medium text-brand-700 transition hover:border-brand-400 hover:bg-brand-100">${escapeHtml(s)}</button>`,
              )
              .join("")}
          </div>`
            : "";

        return `
        <div class="rounded-2xl border border-brand-100 bg-white p-5 shadow-sm sm:p-6">
          <h3 class="mb-3 text-sm font-bold text-brand-700">오마이치에게 더 깊게 물어보기</h3>
          ${chips}
          <div class="flex flex-col gap-2 sm:flex-row">
            <input type="text" id="follow-up-input" value="${escapeHtml(state.followUpInput)}"
              placeholder="예: 5박 6일로 늘려서 다시 추천해줘"
              class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm outline-none transition focus:border-brand-500 focus:bg-white focus:ring-2 focus:ring-brand-200" />
            <button type="button" data-action="follow-up-submit" ${state.followUpInput.trim() ? "" : "disabled"}
              class="inline-flex h-12 items-center justify-center rounded-xl bg-brand-600 px-5 text-sm font-semibold text-white transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-300">이어서 물어보기</button>
          </div>
        </div>`;
      }

      /* ================================================================== */
      /* 이벤트 바인딩                                                       */
      /* ================================================================== */
      function bindEvents() {
        const root = document.getElementById("app");

        // 입력창
        const q = root.querySelector("#question-input");
        if (q) {
          q.addEventListener("input", (e) => {
            state.question = e.target.value;
            const cc = root.querySelector("#char-count");
            if (cc) cc.textContent = state.question.length + " / 2000";
            const btn = root.querySelector('[data-action="ask"]');
            if (btn) {
              if (state.question.trim()) btn.removeAttribute("disabled");
              else btn.setAttribute("disabled", "");
            }
          });
          q.addEventListener("keydown", (e) => {
            // Ctrl/Cmd + Enter 로 빠르게 제출
            if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
              e.preventDefault();
              ask();
            }
          });
        }

        // 메모
        const note = root.querySelector("#note-input");
        if (note) {
          note.addEventListener("input", (e) => setNote(e.target.value));
        }

        // Follow-up 입력창
        const followInput = root.querySelector("#follow-up-input");
        if (followInput) {
          followInput.addEventListener("input", (e) => {
            state.followUpInput = e.target.value;
            const btn = root.querySelector('[data-action="follow-up-submit"]');
            if (btn) {
              if (state.followUpInput.trim()) btn.removeAttribute("disabled");
              else btn.setAttribute("disabled", "");
            }
          });
          followInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && state.followUpInput.trim()) {
              e.preventDefault();
              ask(null, { isFollowUp: true });
            }
          });
        }

        // 버튼 위임
        root.addEventListener("click", (e) => {
          const target = e.target.closest("[data-action]");
          if (!target) return;
          const action = target.getAttribute("data-action");
          switch (action) {
            case "ask":
              ask();
              break;
            case "quick":
              ask(target.getAttribute("data-question"));
              break;
            case "show-answer":
              state.view = "answer";
              render();
              break;
            case "show-staff":
              state.view = "staff";
              render();
              break;
            case "reset":
              reset();
              break;
            case "copy":
              copyAnswer();
              break;
            case "load-history":
              loadHistoryItem(target.getAttribute("data-id"));
              break;
            case "follow-up-chip":
              ask(target.getAttribute("data-question"), { isFollowUp: true });
              break;
            case "follow-up-submit":
              if (state.followUpInput.trim()) {
                ask(null, { isFollowUp: true });
              }
              break;
          }
        });
      }

      render();
    </script>
  </body>
</html>
